<!DOCTYPE html>
<html lang="en">
<head>
  <title>Food Blog</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
  <style>
    * { font-family:Arial, Helvetica, sans-serif; }
    #leftside { float:left; width: 30%; min-height: 1200px; background-color:rgb(77, 192, 154);}
    #rightside { float:left; width: 70%; min-height: 1200px; background-color:rgb(238, 226, 192); position:relative;}
    #container { background-color:rgba(255, 255, 255, 0.85); position: absolute; top: 15%; left: 15%; min-width: 1100px; min-height: 1050px; border-radius: 0.7em;}
    header { height: 50px; background-color:rgba(231, 229, 229, 0.5); font-size: 2.75em; padding:0.5em; color:rgb(216, 150, 7);}
    header span { font-family: 'Sacramento', cursive; }
    main { position: relative; }
    main h2 { position: absolute; left: 20%; top: 30px; margin: 25px 0 200px 50px; color:rgb(60, 190, 160); text-transform: uppercase;}
    section#blogposts { position: absolute; left: 20%; top: 70px; padding: 50px;}
    main .post { margin: 25px; padding: 25px; border: 2px solid rgba(83, 78, 58, 0.6); border-radius: 0.5em;}
    footer { position: absolute; bottom: 0; height: 50px; width: 100%; text-align: center; font-size: 0.85em;}
    
    /* Floating box (modal) */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 20px;
      width: 300px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    .modal button {
      background: crimson;
      color: white;
      border: none;
      padding: 6px 12px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    .profile-pic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <aside id="leftside"></aside>
  <aside id="rightside"></aside>

  <div id="app">
    <div id="container">
      <header><span>Food Blog</span></header>

      <main>
        <h2>Comments</h2>
        <section id="blogposts">
          <div class="post" v-for="(p, index) in posts" :key="index">
            <!-- Profile image (clickable) -->
            <img class="profile-pic" v-bind:src="p.img" @click="openProfile(p)" alt="Profile Picture">
            
            <span class="author">{{ p.author }}</span> — 
            <span class="date">{{ p.date }}</span>
            <span class="reply">REPLY</span>
            <p>{{ p.content }}</p>
          </div>
        </section>
      </main>

      <footer>
        &copy; Copyright FOOD BLOG
      </footer>
    </div>

    <!-- Floating Profile Box -->
    <div v-if="activeProfile" class="modal">
      <h3>{{ activeProfile.author }}</h3>
      <p><strong>Foodie Level:</strong> {{ activeProfile.level }}</p>
      <p><strong>Bio:</strong> {{ activeProfile.bio }}</p>
      <button @click="activeProfile = null">Close</button>
    </div>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        placeholderImg: "images/profile.png", // your provided placeholder
        activeProfile: null,
        posts: [
          {
            author: "Brianna",
            date: "February 18, 2021 @ 3:30 pm",
            content: "Was amazing! My Walmart didn’t have coriander in stock...",
            img: "images/profile.png",
            level: "Novice",
            bio: "Food enthusiast. Love to cook and experiment. Into only organic, fat free, sugar free stuffs!"
          },
          {
            author: "LINH",
            date: "February 15, 2021 @ 9:46 am",
            content: "I just made this soup today and it’s so tasty!...",
            img: "images/profile.png",
            level: "Newcomer",
            bio: "Love food! Grew up with meat and potatoes. Recently venture outside my comfort zone. Loving everything I have been eating so far. Thai is my favorite at this time."
          },
          {
            author: "CATHERINE LEONARDO",
            date: "February 13, 2021 @ 12:58 pm",
            content: "I LOVE this White Chicken Chili! You are right...",
            img: "images/profile.png",
            level: "Mentor",
            bio: "I have to say I never was the adventurous type until 2 years ago. My boyfriend, who is of Japanese background, exposed me to other cultural food and I have never look back since!"
          },
          {
            author: "KALI",
            date: "February 13, 2021 @ 11:31 am",
            content: "This recipe is dynamite! My partner usually won’t eat beans...",
            img: "images/profile.png",
            level: "Novice",
            bio: "Food is my passion. So is cooking. I love to experiment and try new things. I have to admit I'm a food whore! Invite me over for dinner and I'll be there!"
          }
        ]
      },
      methods: {
        openProfile(profile) {
          this.activeProfile = profile;
        }
      }
    });
  </script>
</body>
</html>
